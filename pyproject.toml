[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "0.3.0"
description = "Framework for evaluating and defending against prompt injection attacks on LLMs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
anthropic = ["anthropic>=0.25.0"]
all = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "anthropic>=0.25.0", "pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["promptguard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
